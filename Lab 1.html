<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фреймы с Содержимым Ссылок</title>
    <style>
        body {
            margin: 0;
            display: flex;
            height: 100vh;
            background-color: #8B4513; /* Фон страницы */
        }
        #vertical-frame {
            width: 150px; /* Ширина вертикального фрейма */
            background-color: #8B4513; /* Фон вертикального фрейма */
            border-radius: 20px; /* Закругленные углы */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .horizontal-container {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            height: 100%; /* Занимаем всю высоту */
            margin: 0; /* Убираем отступы */
        }
        #horizontal-frame-1 {
            height: 2cm; /* Высота первого горизонтального фрейма */
            background-color: #8B4513; /* Фон первого горизонтального фрейма */
            border-radius: 20px; /* Закругленные углы */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .horizontal-frame {
            flex-grow: 1; /* Равномерное распределение пространства */
            background-color: #8B4513; /* Фон для второго и третьего горизонтальных фреймов */
            border-radius: 20px; /* Закругленные углы */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #horizontal-frame-4 {
            height: 350px; /* Высота четвертого горизонтального фрейма */
            background-color: #8B4513; /* Фон четвертого горизонтального фрейма */
            border-radius: 20px; /* Закругленные углы */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        iframe {
            border: none; /* Убираем обводку */
            width: 100%; /* Занимаем всю ширину */
            height: 100%; /* Занимаем всю высоту */
            border-radius: 20px; /* Закругленные углы */
        }
    </style>
</head> 
<body>

    <div id="vertical-frame" class="frame">
        <iframe src="https://i.pinimg.com/originals/31/d7/78/31d778347048bf977cf85b890b2fc7f9.jpg"></iframe>
    </div>
    
    <div class="horizontal-container">
        <div id="horizontal-frame-1" class="frame">
            <iframe src="https://sf.misis.ru"></iframe>
        </div>
        <div style="display: flex; flex-grow: 1; margin: 0;"> <!-- Убираем отступы -->
            <div id="horizontal-frame-2" class="horizontal-frame">
                <iframe src="https://blog.skillfactory.ru/poleznye-resursy-dlya-vseh-kto-interesuetsya-it/?ysclid=m1tmwt742t511756862"></iframe>
            </div>
            <div id="horizontal-frame-3" class="horizontal-frame">
                <iframe src="https://itproger.com/"></iframe>
            </div>
        </div>
        <div id="horizontal-frame-4" class="frame">
            <iframe src="https://rutube.ru/channel/23750838/"></iframe>
        </div>
    </div>

</body>
</html>
